    else { const price = maskPrice(); btn(x + 16, y + 236, w - 32, 44, 'ВЕРНУТЬСЯ В УСАХ · ' + price, S.cans >= price ? 'ghost' : 'off', () => wearMask(id), 16); if (S.cans < price) text(g, 'мало банок', x + w / 2, y + 226, font(400, 12, FF.body), P.dim, 'center'); }
  });
}

/* ================= цикл и управление ================= */
function update(dt) {
  stateT += dt;
  if (state === 'set' && R) updateSet(dt);
  musicTick();
}
function draw() {
  BTN.length = 0;
  g.setTransform(PX, 0, 0, cv.height / H, 0, 0);
  if (state === 'title') drawTitle();
  else if (state === 'brief') drawBrief();
  else if (state === 'plan') drawPlan();
  else if (state === 'set') drawSet();
  else if (state === 'done') drawDone();
  else if (state === 'gyms') drawGyms();
  else if (state === 'sounds') drawSounds();
}
const PTR = new Map(); let KEYHOLD = false;
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function hitBtn(x, y) { for (let i = BTN.length - 1; i >= 0; i--) { const b = BTN[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; } return null; }
function onPress(x, y) {
  if (state !== 'set' || !R) return;
  if (R.mode === 'push') pushTap(x, y);
  else if (R.mode === 'crash' && R.crashT > 1.0 && R.crashT < 3.4) R.crashT = 3.4;
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); ensureAudio();
  const [x, y] = toLogical(e), b = hitBtn(x, y);
  if (b) { PTR.set(e.pointerId, 'btn'); play('tick', 0.5); b.fn(); return; }
  PTR.set(e.pointerId, 'hold'); try { cv.setPointerCapture(e.pointerId); } catch (err) { /* нет */ }
  onPress(x, y);
});
const lift = (e) => { PTR.delete(e.pointerId); };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift); cv.addEventListener('lostpointercapture', lift);
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if (e.code !== 'Space' || e.repeat) return; e.preventDefault(); ensureAudio(); KEYHOLD = true; onPress(560, 280); });
window.addEventListener('keyup', (e) => { if (e.code === 'Space') KEYHOLD = false; });
// свернули игру — звук и музыка замолкают, вернулись — продолжают
document.addEventListener('visibilitychange', () => { if (document.hidden) { PTR.clear(); KEYHOLD = false; } if (A) { if (document.hidden) A.ctx.suspend().catch(() => {}); else A.ctx.resume().catch(() => {}); } });
function goFullscreen() {
  if (IS_IOS) return;
  try {
    const el = document.documentElement, fs = document.fullscreenElement || document.webkitFullscreenElement;
    const lock = () => { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) { /* нет */ } };
    if (fs) { lock(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.then) r.then(lock).catch(() => {}); }
  } catch (e) { /* без полного экрана */ }
}
// Слабый телефон: если кадры долго тормозят, рисуем в меньшем разрешении.
let slow = 0, PAUSED = false, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (PAUSED || document.hidden) return;
  update(dt); draw();
  if (state === 'set') { slow = dt > 0.026 ? slow + 1 : Math.max(0, slow - 2); if (slow > 90 && QUAL > 1) { QUAL = QUAL > 1.5 ? 1.5 : 1; slow = 0; resize(); } }
}

/* ================= иконка (для PNG) и запуск ================= */
function drawIcon(N) {
  document.getElementById('rotate').style.display = 'none';
  cv.style.cssText = 'position:fixed;left:0;top:0;width:' + N + 'px;height:' + N + 'px'; cv.width = N; cv.height = N;
  g.setTransform(N / 512, 0, 0, N / 512, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, '#2A2E36'); gr.addColorStop(1, '#16181C'); g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.save(); g.beginPath(); g.rect(0, 432, 512, 80); g.clip(); for (let x = -80; x < 600; x += 48) { g.fillStyle = P.yellow; g.beginPath(); g.moveTo(x, 512); g.lineTo(x + 40, 432); g.lineTo(x + 64, 432); g.lineTo(x + 24, 512); g.fill(); } g.restore();
  blob(g, [{ k: 'line', p: [[40, 150], [472, 150]], w: 14, c: P.steel }], 5);
  for (const sg of [-1, 1]) { const cx = 256 + sg * 168; blob(g, [{ k: 'rr', x: cx - 16, y: 70, w: 32, h: 160, r: 8, c: P.red }, { k: 'rr', x: cx + sg * 22 - 14, y: 85, w: 28, h: 130, r: 8, c: P.blue }], 5); }
  head(g, 256, 302, 112, { mood: 'strain', skin: '#E58591', band: true, ol: 6 });
}
const ICON = location.protocol === 'file:' ? parseInt(QS.get('icon') || '0', 10) : 0;
if (ICON) { const go2 = () => drawIcon(ICON); go2(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(go2); return; }

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
try { if (document.fonts && document.fonts.load) Promise.all(['700 20px Oswald', '400 20px "Rubik Mono One"', '500 20px Rubik', '700 20px Caveat'].map((f) => document.fonts.load(f))).then(() => CACHE.clear(), () => {}); } catch (e) { /* запасные шрифты */ }
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// Для автопроверки: управление игрой без пальцев (звука нет: ?mute и браузер без звука).
window.ER = {
  get S() { return S; }, get R() { return R; }, get state() { return state; }, get DONE() { return DONE; }, get PLANS() { return PLANS; },
  pause(v) { PAUSED = v; }, go, goPlan, startSet, rackBar, callSpot, pushTap, crash,
  reset() { S = fresh(); save(); CACHE.clear(); go('title'); },
  hold(v) { if (v) { PTR.set(-1, 'hold'); onPress(560, 280); } else PTR.delete(-1); },
  tap(x = 560, y = 280) { onPress(x, y); },
  step(sec, fps = 60) { const dt = 1 / fps; for (let i = 0; i < Math.round(sec * fps); i++) update(dt); draw(); },
  more(v) { answerMore(v); },
  forceCall(v) { FORCE_CALL = v; },
  bro() { callBro(); },
  loud() { if (!A) return null; const o = {}; for (const [k, b] of Object.entries(A.buf)) o[k] = +(20 * Math.log10(measureLoud(b) / SFX_TARGET)).toFixed(1); return o; },
  audioInfo() {
    if (!A) return null;
    const out = {};
    for (const [k, b] of Object.entries(A.buf)) {
      const d = b.getChannelData(0); let pk = 0, sum = 0, nan = 0, zc = 0;
      for (let i = 0; i < d.length; i++) { const v = d[i]; if (!Number.isFinite(v)) { nan++; continue; } pk = Math.max(pk, Math.abs(v)); sum += v * v; if (i && (d[i - 1] < 0) !== (v < 0)) zc++; }
      out[k] = { dur: +b.duration.toFixed(2), peak: +pk.toFixed(2), rms: +Math.sqrt(sum / d.length).toFixed(3), nan, zcrHz: Math.round(zc / 2 / b.duration) };
    }
    return out;
  },
  buttons() { return BTN.map((b) => [Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h)]); },
};
})();
