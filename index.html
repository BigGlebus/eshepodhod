}

  if (state === 'title') drawTitle();

}
const PTR = new Map(); let KEYHOLD = false;

cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift); cv.addEventListener('lostpointercapture', lift);

let slow = 0, PAUSED = false, last = performance.now();

  blob(g, [{ k: 'line', p: [[40, 150], [472, 150]], w: 14, c: P.steel }], 5);
  for (const sg of [-1, 1]) { const cx = 256 + sg * 168; blob(g, [{ k: 'rr', x: cx - 16, y: 70, w: 32, h: 160, r: 8, c: P.red }, { k: 'rr', x: cx + sg * 22 - 14, y: 85, w: 28, h: 130, r: 8, c: P.blue }], 5); }
  head(g, 256, 302, 112, { mood: 'strain', skin: '#E58591', band: true, ol: 6 });
}
const ICON = location.protocol === 'file:' ? parseInt(QS.get('icon') || '0', 10) : 0;
if (ICON) { const go2 = () => drawIcon(ICON); go2(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(go2); return; }

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
try { if (document.fonts && document.fonts.load) Promise.all(['700 20px Oswald', '400 20px "Rubik Mono One"', '500 20px Rubik', '700 20px Caveat'].map((f) => document.fonts.load(f))).then(() => CACHE.clear(), () => {}); } catch (e) { /* запасные шрифты */ }
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// Для автопроверки: управление игрой без пальцев (звука нет: ?mute и браузер без звука).
window.ER = {
  get S() { return S; }, get R() { return R; }, get state() { return state; }, get DONE() { return DONE; }, get PLANS() { return PLANS; },
  pause(v) { PAUSED = v; }, go, goPlan, startSet, rackBar, callSpot, pushTap, crash,
  reset() { S = fresh(); save(); CACHE.clear(); go('title'); },
  hold(v) { if (v) { PTR.set(-1, 'hold'); onPress(560, 280); } else PTR.delete(-1); },
  tap(x = 560, y = 280) { onPress(x, y); },
  step(sec, fps = 60) { const dt = 1 / fps; for (let i = 0; i < Math.round(sec * fps); i++) update(dt); draw(); },
  buttons() { return BTN.map((b) => [Math.round(b.x), Math.round(b.y), Math.round(b.w), Math.round(b.h)]); },
};
})();
